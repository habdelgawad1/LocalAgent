<h1>Agent security notes</h1>
<p>Agentic systems keep memory, call tools and coordinate with other agents.</p>
<p>Attacks can be instantaneous, persist for a session, or accumulate across sessions.</p>
<p>Testing each layer separately makes the findings easier to act on.</p>
